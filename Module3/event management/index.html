<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Event Management System</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

<div class="container py-5">

    <div class="text-center mb-5">

        <h1 class="fw-bold">
            Event Management System
        </h1>

        <p class="text-muted">
            Create and manage your events
        </p>

    </div>


    <!-- Event Registration -->

    <div class="card shadow mb-5">

        <div class="card-header bg-primary text-white">

            <h3 class="mb-0">
                Create New Event
            </h3>

        </div>


        <div class="card-body">

            <form id="eventForm">

                <div class="row">

                    <!-- Event Name -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Event Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            class="form-control"
                            placeholder="Enter event name"
                            required>

                    </div>


                    <!-- Organizer -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Organizer
                        </label>

                        <input
                            type="text"
                            id="organizer"
                            class="form-control"
                            placeholder="Enter organizer name"
                            required>

                    </div>


                    <!-- Date -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Event Date
                        </label>

                        <input
                            type="date"
                            id="date"
                            class="form-control"
                            required>

                    </div>


                    <!-- Time -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Event Time
                        </label>

                        <input
                            type="time"
                            id="time"
                            class="form-control"
                            required>

                    </div>


                    <!-- Venue -->

                    <div class="col-md-12 mb-3">

                        <label class="form-label">
                            Venue
                        </label>

                        <input
                            type="text"
                            id="venue"
                            class="form-control"
                            placeholder="Enter event venue"
                            required>

                    </div>


                    <!-- Description -->

                    <div class="col-md-12 mb-3">

                        <label class="form-label">
                            Description
                        </label>

                        <textarea
                            id="description"
                            class="form-control"
                            rows="4"
                            placeholder="Enter event description">
                        </textarea>

                    </div>

                </div>


                <div class="text-center">

                    <button
                        type="submit"
                        class="btn btn-primary">

                        Create Event

                    </button>

                    <button
                        type="reset"
                        class="btn btn-secondary">

                        Reset

                    </button>

                </div>

            </form>


            <div
                id="message"
                class="alert mt-3 d-none">
            </div>

        </div>

    </div>


    <!-- Events -->

    <div class="d-flex justify-content-between align-items-center mb-3">

        <h2>
            Upcoming Events
        </h2>

        <button
            onclick="loadEvents()"
            class="btn btn-outline-primary">

            Refresh

        </button>

    </div>


    <div
        id="eventList"
        class="row g-4">

    </div>

</div>


<script
    src="{{ url_for('static', filename='script.js') }}">
</script>

</body>

</html>
